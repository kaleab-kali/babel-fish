name: Flutter App

on:
  pull_request:
    paths:
      - app/**
      - packages/**
      - tool/verify_app_identity.dart
      - tool/verify_fixture_offline.dart
      - tool/verify_fixture_permissions.dart
      - tool/verify_web_metadata.dart
      - tool/verify_web_build_budget.dart
      - .github/workflows/flutter-app.yml
  push:
    branches:
      - main
    paths:
      - app/**
      - packages/**
      - tool/verify_app_identity.dart
      - tool/verify_fixture_offline.dart
      - tool/verify_fixture_permissions.dart
      - tool/verify_web_metadata.dart
      - tool/verify_web_build_budget.dart
      - .github/workflows/flutter-app.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        working-directory: app
        run: flutter --version

      - name: Install app dependencies
        working-directory: app
        run: flutter pub get

      - name: Check app formatting
        working-directory: app
        run: dart format --set-exit-if-changed .

      - name: Verify fixture mode permissions
        run: dart tool/verify_fixture_permissions.dart

      - name: Verify app identity
        run: dart tool/verify_app_identity.dart

      - name: Verify fixture offline mode
        run: dart tool/verify_fixture_offline.dart

      - name: Verify web metadata
        run: dart tool/verify_web_metadata.dart

      - name: Analyze app
        working-directory: app
        run: dart analyze

      - name: Test app
        working-directory: app
        run: flutter test

      - name: Build web app
        working-directory: app
        run: flutter build web

      - name: Verify web build size budget
        run: dart tool/verify_web_build_budget.dart

      - name: Build Android debug app
        working-directory: app
        run: flutter build apk --debug
