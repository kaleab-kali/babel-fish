name: Deploy Web

on:
  pull_request:
    paths:
      - app/**
      - packages/**
      - tool/verify_fixture_permissions.dart
      - tool/verify_web_metadata.dart
      - tool/verify_web_build_budget.dart
      - .github/workflows/deploy-web.yml
  push:
    branches:
      - main
    paths:
      - app/**
      - packages/**
      - tool/verify_fixture_permissions.dart
      - tool/verify_web_metadata.dart
      - tool/verify_web_build_budget.dart
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Flutter web artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        working-directory: app
        run: flutter --version

      - name: Verify fixture mode permissions
        run: dart tool/verify_fixture_permissions.dart

      - name: Verify web metadata
        run: dart tool/verify_web_metadata.dart

      - name: Install app dependencies
        working-directory: app
        run: flutter pub get

      - name: Check app formatting
        working-directory: app
        run: dart format --set-exit-if-changed .

      - name: Analyze app
        working-directory: app
        run: dart analyze

      - name: Test app
        working-directory: app
        run: flutter test

      - name: Build web app
        working-directory: app
        run: flutter build web --base-href "/babel-fish/"

      - name: Verify web build size budget
        run: dart tool/verify_web_build_budget.dart

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.BABEL_FISH_PAGES_DEPLOY == 'true'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.BABEL_FISH_PAGES_DEPLOY == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: app/build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.BABEL_FISH_PAGES_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v5
