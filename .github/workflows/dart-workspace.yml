name: Dart Workspace

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "19 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Show Dart version
        run: dart --version

      - name: Install dependencies
        run: dart pub get

      - name: Verify no secrets or recording artifacts
        run: dart tool/verify_no_secrets.dart

      - name: Verify workflow security
        run: dart tool/verify_workflow_security.dart

      - name: Verify pubspec metadata
        run: dart tool/verify_pubspec_metadata.dart

      - name: Verify fixture offline mode
        run: dart tool/verify_fixture_offline.dart

      - name: Verify Markdown links
        run: dart tool/verify_markdown_links.dart

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze workspace
        run: dart analyze

      - name: Test core package
        run: dart test packages/babelfish_core

      - name: Test fixtures package
        run: dart test packages/babelfish_fixtures

      - name: Test providers package
        run: dart test packages/babelfish_providers
