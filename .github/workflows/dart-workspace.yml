name: Dart Workspace

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Show Dart version
        run: dart --version

      - name: Install dependencies
        run: dart pub get

      - name: Verify no secrets or recording artifacts
        run: dart tool/verify_no_secrets.dart

      - name: Verify Markdown links
        run: dart tool/verify_markdown_links.dart

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze workspace
        run: dart analyze

      - name: Test core package
        run: dart test packages/babelfish_core

      - name: Test fixtures package
        run: dart test packages/babelfish_fixtures

      - name: Test providers package
        run: dart test packages/babelfish_providers
